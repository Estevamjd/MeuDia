# WAHA (WhatsApp HTTP API, Core grátis) para o assistente do MeuDia. docs/whatsapp.md
# Fica em /docker/waha no VPS, atrás do Traefik existente. Segredos só no .env do VPS (nunca no git).
# Rede: entra na meudia_default para falar com o app por dentro (http://meudia:3000), sem sair para a internet.
services:
  waha:
    image: devlikeapro/waha:gows
    container_name: waha
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    env_file:
      - .env
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      TZ: America/Sao_Paulo
      WAHA_PRINT_QR: "False"
      WAHA_LOG_FORMAT: JSON
      WAHA_LOG_LEVEL: warn
      WAHA_HTTP_LOG_LEVEL: info # acessos HTTP fora do log (LOG_LEVEL=warn)
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      WHATSAPP_SWAGGER_ENABLED: "false"
      # Só texto: não baixa mídia (privacidade e disco).
      WAHA_EVENTS_DOWNLOAD_MEDIA: "false"
      WAHA_API_DOWNLOAD_MEDIA: "false"
      WAHA_APPS_ENABLED: "False"
      WHATSAPP_HOOK_URL: http://meudia:3000/api/whatsapp/webhook
      WHATSAPP_HOOK_EVENTS: message
      WHATSAPP_HOOK_RETRIES_POLICY: linear
      WHATSAPP_HOOK_RETRIES_DELAY_SECONDS: "3"
      WHATSAPP_HOOK_RETRIES_ATTEMPTS: "3"
      WAHA_PUBLIC_URL: https://waha.srv2176785.hstgr.cloud
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      - meudia
    labels:
      - traefik.enable=true
      - traefik.http.routers.waha.rule=Host(`waha.srv2176785.hstgr.cloud`)
      - traefik.http.routers.waha.entrypoints=websecure
      - traefik.http.routers.waha.tls.certresolver=letsencrypt
      - traefik.http.services.waha.loadbalancer.server.port=3000

volumes:
  waha_sessions:

networks:
  meudia:
    name: meudia_default
    external: true
