# Deploy behind the existing Traefik on srv2176785.hstgr.cloud.
# Do not add another proxy. Do not change the n8n compose project.
services:
  meudia:
    image: meudia-web:latest
    build:
      context: ./src
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-MeuDia}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "127.0.0.1::3000" # só loopback: o acesso público é pelo Traefik (HTTPS)
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      APP_MODE: ${APP_MODE:-financas}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    labels:
      - traefik.enable=true
      - traefik.http.routers.meudia.rule=Host(`meudia.srv2176785.hstgr.cloud`)
      - traefik.http.routers.meudia.entrypoints=websecure
      - traefik.http.routers.meudia.tls.certresolver=letsencrypt
      - traefik.http.services.meudia.loadbalancer.server.port=3000
      - traefik.http.routers.meudia.priority=1
      - traefik.http.routers.meudia-api.rule=Host(`meudia.srv2176785.hstgr.cloud`) && PathPrefix(`/api/`)
      - traefik.http.routers.meudia-api.priority=100
      - traefik.http.routers.meudia-api.entrypoints=websecure
      - traefik.http.routers.meudia-api.tls.certresolver=letsencrypt
      - traefik.http.routers.meudia-api.service=meudia
      - traefik.http.routers.meudia-api.middlewares=meudia-api-limit
      - traefik.http.middlewares.meudia-api-limit.ratelimit.average=60
      - traefik.http.middlewares.meudia-api-limit.ratelimit.period=1m
      - traefik.http.middlewares.meudia-api-limit.ratelimit.burst=30
      - traefik.http.routers.meudia-login.rule=Host(`meudia.srv2176785.hstgr.cloud`) && (Path(`/login`) || Path(`/registro`) || Path(`/esqueci-senha`))
      - traefik.http.routers.meudia-login.priority=100
      - traefik.http.routers.meudia-login.entrypoints=websecure
      - traefik.http.routers.meudia-login.tls.certresolver=letsencrypt
      - traefik.http.routers.meudia-login.service=meudia
      - traefik.http.routers.meudia-login.middlewares=meudia-login-limit
      - traefik.http.middlewares.meudia-login-limit.ratelimit.average=30
      - traefik.http.middlewares.meudia-login-limit.ratelimit.period=1m
      - traefik.http.middlewares.meudia-login-limit.ratelimit.burst=20
      - traefik.http.routers.meudia-ganchos.rule=Host(`meudia.srv2176785.hstgr.cloud`) && (PathPrefix(`/api/whatsapp/`) || PathPrefix(`/api/cron/`))
      - traefik.http.routers.meudia-ganchos.priority=200
      - traefik.http.routers.meudia-ganchos.entrypoints=websecure
      - traefik.http.routers.meudia-ganchos.tls.certresolver=letsencrypt
      - traefik.http.routers.meudia-ganchos.service=meudia
      - traefik.http.routers.meudia-ganchos.middlewares=meudia-ganchos-limit
      - traefik.http.middlewares.meudia-ganchos-limit.ratelimit.average=600
      - traefik.http.middlewares.meudia-ganchos-limit.ratelimit.period=1m
      - traefik.http.middlewares.meudia-ganchos-limit.ratelimit.burst=200
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 40s
