name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# A versão do pnpm vem só do campo "packageManager" do package.json.
# Não passar "version" ao pnpm/action-setup: duas fontes geram "Multiple versions of pnpm specified".

jobs:
  static:
    name: Type check, lint e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: scripts/verify.sh static

  e2e-mock:
    name: E2E mock (iPhone 13 WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Instalar WebKit do Playwright
        run: pnpm --filter @meudia/web exec playwright install --with-deps webkit
      - run: scripts/verify.sh e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-mock-artifacts
          path: apps/web/e2e/artifacts/
          retention-days: 7
